name: Deploy Kubernetes App via Harbor

on:
  push:
    branches:
      - master

env:
  HARBOR_REGISTRY: 192.168.56.101:8088
  HARBOR_PROJECT: k8s-lab
  IMAGE_NAME: jenkins-k8s-demo
  K8S_NAMESPACE: production

jobs:

  deploy:

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Prepare image tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo \
            "FULL_IMAGE=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG}" \
            >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t "$FULL_IMAGE" \
            .

      - name: Login Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push "$FULL_IMAGE"

      - name: Deploy to Kubernetes
        run: |
          kubectl set image \
            -f deployment.yaml \
            nginx="$FULL_IMAGE" \
            --local \
            -o yaml \
          | kubectl apply -f -

          kubectl apply \
            -f service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status \
            deployment/jenkins-k8s-demo \
            -n "$K8S_NAMESPACE" \
            --timeout=120s

          kubectl get pods \
            -n "$K8S_NAMESPACE"

          echo "Running image:"

          kubectl get deployment \
            jenkins-k8s-demo \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

      - name: Logout Harbor
        if: always()
        run: |
          docker logout "$HARBOR_REGISTRY" || true

